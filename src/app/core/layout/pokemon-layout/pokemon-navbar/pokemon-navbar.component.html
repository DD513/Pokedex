<nav>
  <div class="logo-container">
    <a routerLink="/" routerLinkActive="active" class="logo">
      <img [src]="homePageLogo" alt="Pokemon Logo" />
      <span class="logo-text">Pokemon</span>
    </a>
  </div>

  <div class="profile-container" (click)="toggleDropdown()">
    <div class="profile-info">
      <img [src]="userAvatar" alt="User Avatar" class="profile-avatar" />
      <span class="profile-name">{{ userName }}</span>
    </div>

    <img
      [src]="dropdownMenuIcon"
      alt="Dropdown Menu"
      class="dropdown-menu-icon"
    />
  </div>

  <div *ngIf="isDropdownOpen" class="dropdown-menu">
    <ul>
      <li *ngIf="isLoggedIn" class="dropdown-profile">
        <img
          [src]="userAvatar"
          alt="User Avatar"
          class="dropdown-profile-avatar"
        />
        <div class="dropdown-profile-details">
          <span class="dropdown-profile-name">{{ userName }}</span>
          <span class="dropdown-profile-email">{{ userEmail }}</span>
        </div>
      </li>

      <hr *ngIf="isLoggedIn" class="dropdown-divider" />

      <li *ngIf="!isLoggedIn" (click)="openLoginModal()">
        <img [src]="loginIcon" alt="Login Logo" class="menu-icon" />
        <span class="dropdown-menu-text">登入</span>
      </li>
      <hr *ngIf="!isLoggedIn" class="dropdown-divider" />

      <li (click)="navigateTo('/pokedex')">
        <img [src]="pokedexLogo" alt="Pokedex Logo" class="menu-icon" />
        <span class="dropdown-menu-text">寶可夢圖鑑</span>
      </li>
      <li (click)="handleProtectedRouteNavigation('/pokelottery')">
        <img [src]="pokeLotteryLogo" alt="Pokelottery Logo" class="menu-icon" />
        <span class="dropdown-menu-text">寶可夢抽抽樂</span>
      </li>
      <li (click)="navigateTo('/pokemon-dictionary')">
        <img
          [src]="pokemonDictionaryLogo"
          alt="Dictionary Icon"
          class="menu-icon"
        />
        <span class="dropdown-menu-text">寶可夢字典</span>
      </li>

      <hr class="dropdown-divider" />

      <li (click)="navigateTo('/pokedex')">
        <img [src]="pokemonNewsIcon" alt="Pokemon News" class="menu-icon" />
        <span class="dropdown-menu-text">最新消息</span>
      </li>
      <li (click)="navigateTo('/pokedex')">
        <img [src]="pokemonGoAppIcon" alt="PokemonGo News" class="menu-icon" />
        <span class="dropdown-menu-text">取得Pokemon應用程式</span>
      </li>

      <hr *ngIf="isLoggedIn" class="dropdown-divider" />

      <li *ngIf="isLoggedIn" (click)="logout()">
        <img [src]="logoutIcon" alt="Logout Logo" class="menu-icon" />
        <span class="dropdown-menu-text">登出</span>
      </li>
    </ul>
  </div>
</nav>

<app-login-modal
  *ngIf="isLoginModalOpen"
  (close)="isLoginModalOpen = false"
  (loginCompleted)="handleLoginCompleted()"
></app-login-modal>

<app-success-toast></app-success-toast>
